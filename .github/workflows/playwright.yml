name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: ['20.x', '22.x']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      
      - name: Build project
        run: npm run build --if-present
      
      - name: Run Playwright tests
        run: npm run test:ci
        env:
          BASE_URL: https://practicesoftwaretesting.com
          API_URL: https://api.practicesoftwaretesting.com

          ADMIN_USER_EMAIL: admin@practicesoftwaretesting.com	
          ADMIN_USER_PASSWORD: welcome01

          USER_1_EMAIL: customer@practicesoftwaretesting.com
          USER_1_PASSWORD: welcome01

          USER_2_EMAIL: customer2@practicesoftwaretesting.com
          USER_2_PASSWORD: welcome01

          USER_3_EMAIL: customer3@practicesoftwaretesting.com
          USER_3_PASSWORD: pass123
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30